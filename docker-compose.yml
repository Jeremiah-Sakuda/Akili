# Akili — API + frontend. Requires .env with GOOGLE_API_KEY.
# Run: docker compose up --build
# UI: http://localhost:3001  |  API docs: http://localhost:8000/docs

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - AKILI_DB_PATH=/data/akili.db
      # Bind the app to the port compose maps/health-checks below.
      - PORT=8000
    volumes:
      - akili-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    environment:
      - VITE_PROXY_TARGET=http://api:8000
    volumes:
      # Mount .env read-only so Vite (envDir = projectRoot = /) can load VITE_* vars.
      # NOTE: we intentionally do NOT use `env_file: .env` here — that would inject
      # backend secrets (GOOGLE_API_KEY, DATABASE_URL, ...) into the frontend process.
      # Vite only ever exposes VITE_*-prefixed vars to the client.
      - ./.env:/.env:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  akili-data:
